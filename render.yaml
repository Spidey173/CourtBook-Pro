# render.yaml - Production Deployment Configuration
services:
  - type: web
    name: sports-court-booking-platform
    env: python
    buildCommand: pip install -r requirements.txt && python cli.py init-db && python cli.py seed-data
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --worker-class gthread --keep-alive 65 --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_Bl8N7dLaqmgx@ep-twilight-water-axohm68w-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@courtbook.com
      - key: ADMIN_PASSWORD
        generateValue: true
